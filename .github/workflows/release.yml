name: Release

on:
  release:
    types: [published]

# Tag conventions:
#   web/v1.0.0   → web deploy only
#   mobile/v1.0.0 → APK build only
#   v1.0.0        → both

jobs:
  deploy-web:
    name: Deploy to Vercel (production)
    if: |
      startsWith(github.ref, 'refs/tags/web/v') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install -g vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  build-android:
    name: Build Android (EAS)
    if: |
      startsWith(github.ref, 'refs/tags/mobile/v') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # eas-cli 24 pulls @oclif/plugin-autocomplete, which requires node >= 22.
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # Signing keys live in EAS, not in this repo. `eas credentials -p android`
      # is the only place the release keystore is managed, and the fingerprint it
      # reports has to match the one served at /.well-known/assetlinks.json or
      # every Android passkey fails origin validation. See AUTH.md.
      - name: Build APK on EAS
        id: build
        working-directory: apps/mobile
        run: |
          eas build --platform android --profile production \
            --non-interactive --wait --json > build.json
          url=$(node -e "
            const b = require('./build.json')[0]
            if (b.status !== 'FINISHED') throw new Error('build ' + b.status)
            const url = b.artifacts && b.artifacts.applicationArchiveUrl
            if (!url) throw new Error('build produced no application archive')
            console.log(url)
          ")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Attach APK to release
        env:
          URL: ${{ steps.build.outputs.url }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags may contain a slash (mobile/v1.2.3), which is not a legal filename.
          name="ShowTracker-${TAG//\//-}.apk"
          curl -fsSL -o "$name" "$URL"
          gh release upload "$TAG" "$name" --clobber
